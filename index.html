<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="초등 3~6학년 강점 탐색과 생활·학습·독서 습관 자가점검">
<title>숲속 나 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: 한 화면에 한 문항(카드), 결과는 강점 → 습관 3영역 → 다짐 순 한 줄 흐름 */
:root{
  --bg:#EEF4F2; --surface:#FFFFFF; --ink:#1F3A33; --muted:#5B7069; --line:#D3E0DB;
  --leaf:#3E8E5E; --sun:#D99A1E; --sky:#3A7CA5; --stream:#23908C; --star:#7563BE; --mount:#80684F;
  --soft:#E3EEEA;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12201C; --surface:#1A2C27; --ink:#E4EFEA; --muted:#9BB2A9; --line:#2B423A;
  --leaf:#6BC08B; --sun:#F0BE55; --sky:#79B4D8; --stream:#5CC6C1; --star:#AB9CF0; --mount:#C4A887;
  --soft:#203631; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12201C; --surface:#1A2C27; --ink:#E4EFEA; --muted:#9BB2A9; --line:#2B423A;
  --leaf:#6BC08B; --sun:#F0BE55; --sky:#79B4D8; --stream:#5CC6C1; --star:#AB9CF0; --mount:#C4A887;
  --soft:#203631; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;margin:0;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:28px max(56px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(30px,7vw,44px)}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--display);color:var(--leaf);letter-spacing:.06em;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
button{font-family:var(--display);font-size:17px;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 18px;transition:transform .12s,border-color .12s,background .12s}
@media (hover:hover){button:hover{border-color:var(--leaf)}}
button,a,input,select,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.primary{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
@media (hover:hover){.primary:hover{filter:brightness(1.07)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chip{display:flex;align-items:center;gap:8px;font-size:15px}
.ico{width:36px;height:36px;flex:none}
.ico svg{width:100%;height:100%}
/* quiz */
.progress{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-family:var(--display);font-size:clamp(22px,5.4vw,28px);line-height:1.45;min-height:2.9em;text-wrap:balance}
.qex{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:16px;line-height:1.6;min-height:4.4em}
.qex b{font-family:var(--display);font-weight:400;color:var(--muted);font-size:14px}
.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.answers button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;font-size:16px}
.answers button .dots{display:flex;gap:3px}
.answers button .dots b{width:9px;height:9px;border-radius:50%;background:var(--leaf)}
.answers button.sel{background:var(--soft);border-color:var(--leaf)}
.answers button:active{transform:scale(.97)}
@media (max-width:520px){.answers{grid-template-columns:repeat(2,minmax(0,1fr))}.chars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:360px){.answers button{font-size:15px;padding:12px 4px}}
@media (hover:none) and (pointer:coarse){.kbhint{display:none}}
.inapp{background:var(--soft);border:1.5px solid var(--sun);border-radius:14px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
/* results */
.hero{display:flex;flex-direction:column;gap:16px}
.toptwo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.toptwo{grid-template-columns:1fr}}
.top{border-radius:18px;padding:18px;border:2px solid var(--c);background:var(--surface);display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.top .ico{width:54px;height:54px;color:var(--c)}
.top h3{color:var(--c)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:15px}
.bar .name{display:flex;align-items:center;gap:6px}
.bar .name .ico{width:24px;height:24px;color:var(--c)}
.bar .track{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.grow{display:flex;flex-wrap:wrap;gap:8px}
.grow button{display:flex;align-items:center;gap:6px;font-size:15px;padding:8px 12px}
.grow button .ico{width:22px;height:22px;color:var(--c)}
.grow button.sel{border-color:var(--c);background:var(--soft)}
.tipbox{background:var(--soft);border-radius:14px;padding:14px 16px}
.habits{display:flex;flex-direction:column;gap:14px}
.habit{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.habit:first-child{border-top:0;padding-top:0}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--display);font-size:14px;padding:3px 12px;border-radius:99px;border:1.5px solid currentColor}
.lv3{color:var(--leaf)} .lv2{color:var(--sun)} .lv1{color:var(--sky)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;font-size:15px}
.kv dt{font-family:var(--display);color:var(--muted)}
.kv dd{margin:0}
.via{display:flex;gap:8px;align-items:flex-start}
.via .ico{width:24px;height:24px;color:var(--c);margin-top:2px}
input[type=text]{font-family:var(--body);font-size:17px;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 22px}
summary{font-family:var(--display);font-size:18px;cursor:pointer}
details ul{padding-left:20px;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.note{font-size:13px;color:var(--muted);text-align:center}
.toast{font-size:14px;color:var(--leaf)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
textarea.open{font-family:var(--body);font-size:16px;width:100%;min-height:96px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;line-height:1.6}
textarea.open:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.oq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.oq:first-of-type{border-top:0;padding-top:0}
.oq label{font-family:var(--display);font-size:19px;line-height:1.45}
.oq .cnt{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.oans{display:flex;flex-direction:column;gap:12px}
.oans h3{font-size:17px}
.oans p{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:10px 14px}
.tlab{font-family:var(--display);font-size:15px;color:var(--muted);display:block}
.otitle{font-family:var(--body);font-size:17px;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.btitle{font-family:var(--display);font-size:18px}
.oans p.btitle{background:none;padding:0 0 2px}
.print-only{display:none}
.whof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.whof label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:15px;color:var(--muted)}
.whof .nmf{grid-column:1/-1}
.whof input,.whof select{font-family:var(--body);font-size:17px;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.whof input:focus-visible,.whof select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.phead .who span{text-align:center}
.phead{border-bottom:2px solid var(--ink);padding-bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;font-size:11pt}
.phead .who span{display:inline-block;min-width:3.2em;border-bottom:1px solid var(--ink);margin:0 4px}
.phead .who span.nm{min-width:7em}
.pline{border-bottom:1px solid var(--line);min-height:2.2em}
@media print{
  :root:not([data-theme="none"]){--bg:#fff;--surface:#fff;--ink:#1F3A33;--muted:#4F625C;--line:#C9D6D1;--leaf:#3E8E5E;--sun:#C1860F;--sky:#3A7CA5;--stream:#23908C;--star:#7563BE;--mount:#80684F;--soft:#EEF4F1;color-scheme:light}
  @page{size:A4;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11pt;line-height:1.55}
  .wrap{max-width:none;padding:0;gap:10px}
  h1{font-size:22pt} h2{font-size:15pt} h3{font-size:12.5pt}
  .panel,.top{padding:12px 14px;gap:8px;border-radius:10px}
  .top,.habit,.bars,.tipbox,.oans>div{break-inside:avoid}
  h2,.hhead{break-after:avoid}
  .panel,.habits,.oans{display:block}
  .panel>*+*,.habits>*+*,.oans>*+*{margin-top:9px}
  .habit{display:block}
  .habit>*+*{margin-top:6px}
  .no-print,button,details,.toast,#fallback{display:none!important}
  .print-only{display:block!important}
  .phead.print-only{display:flex!important}
  .toptwo{grid-template-columns:1fr 1fr!important}
  .tipbox[hidden]{display:none!important}
}

</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
const ICONS={

 study:{name:'학습 습관',sub:'집중·질문·준비·복습'},

 ['life','밤에 정해진 시간에 잠자리에 들어요.','잠자리에 드는 시간을 정하고, 일주일 동안 지켜 보기'],

function score(ans){
  const s={};ORDER.forEach(k=>s[k]=0);
  const items={life:[],study:[],read:[]};
  Q.forEach((q,i)=>{if(CH[q[0]]) s[q[0]]+=ans[i]; else items[q[0]].push({text:q[1],tip:q[2],v:ans[i]});});
  const ranked=ORDER.map((k,idx)=>({k,v:s[k],idx})).sort((a,b)=>b.v-a.v||a.idx-b.idx);
  const top=ranked.slice(0,2);
  const alsoTied=ranked.slice(2).filter(r=>r.v===top[1].v).map(r=>r.k);
  const habits={};
  Object.keys(items).forEach(a=>{
    const arr=items[a];const avg=arr.reduce((t,x)=>t+x.v,0)/arr.length;
    let best=arr[0];
    arr.forEach(x=>{if(x.v>best.v)best=x;});
    if(best.v<3)best=null;
    let low=null;
    arr.forEach(x=>{if(x===best||!x.tip)return;if(!low||x.v<low.v)low=x;});
    if(low&&low.v>3)low=null;
    habits[a]={avg,best,low,level:avg>=3.25?3:avg>=2.5?2:1};
  });
  return {s,ranked,top,alsoTied,habits};
}

}
function titleField(j){const o=OPEN[j];if(!o.book)return '';return `<span class="tlab">책 제목</span><input type="text" class="otitle" id="t${j}" maxlength="40" placeholder="책 제목" aria-label="책 제목" value="${esc(state.title[j])}"><span class="tlab">${o.why}</span>`;}
function bookTitle(j){const t=state.title[j].trim();return `<p class="btitle"><span class="tlab">책 제목</span>${t?esc(t):'<span class="muted no-print">적지 않았어요</span>'}</p>${t?'':'<div class="print-only pline" style="min-height:2em;border-bottom:1px solid var(--line)"></div>'}<span class="tlab">${OPEN[j].why}</span>`;}
function today(){const d=new Date();return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.';}

function result(){
  const r=score(state.ans);
  const t=r.top.map(x=>x.k);
  const main=t[0];
  const lvTxt={3:'튼튼해요',2:'자라는 중',1:'새싹 단계'};
  app.innerHTML=`
  <div class="hero">
    <div class="phead print-only"><b>숲속 나 찾기 결과지</b><span class="who"><span>${esc(state.who.g)}</span>학년<span>${esc(state.who.c)}</span>반<span>${esc(state.who.n)}</span>번 이름<span class="nm">${esc(state.who.name)}</span></span><span>${today()}</span></div>
    <p class="eyebrow">${state.who.name?esc(state.who.name)+'의 숲 결과':'나의 숲 결과'}</p>
    <h1>${state.who.name?esc(state.who.name)+nameJosa(state.who.name):'나는'} ${CH[t[0]].name}${josa(CH[t[0]].name)} ${CH[t[1]].name}의 힘을 가졌어요</h1>
  </div>
  <div class="toptwo">${t.map(k=>`
    <div class="top" style="--c:${CH[k].c}">
      ${ico(k)}
      <h3>${CH[k].name} · ${CH[k].trait}</h3>
      <p>${CH[k].desc}</p>
    </div>`).join('')}</div>
  ${r.alsoTied.length?`<p class="muted small">${r.alsoTied.map(k=>CH[k].name).join(', ')}도 똑같이 높게 나왔어요. 여러 강점이 함께 자라고 있다는 뜻이에요.</p>`:''}

  <div class="panel">
    <h2>내 안의 숲</h2>
    <p class="muted small">한 강점마다 3문항, 3~12점이에요. 점수가 낮은 강점은 "없는 것"이 아니라 "아직 덜 써 본 것"이에요.</p>
    <div class="bars">${ORDER.map(k=>`
      <div class="bar" style="--c:${CH[k].c}">
        <span class="name">${ico(k)}${CH[k].name}</span>
        <span class="track"><i style="width:${((r.s[k]-3)/9*92+8).toFixed(1)}%"></i></span>
        <span class="num">${r.s[k]}점</span>
      </div>`).join('')}</div>
  </div>

  <div class="panel${state.grow?'':' no-print'}" id="growpanel">
    <h2>키워 보고 싶은 강점 고르기</h2>
    <p class="no-print">더 키우고 싶은 강점 친구를 하나 골라 보세요.</p>
    <div class="grow">${ORDER.map(k=>`<button data-k="${k}" id="g-${k}" class="${state.grow===k?'sel':''}" style="--c:${CH[k].c}">${ico(k)}${CH[k].name}</button>`).join('')}</div>
    <div class="tipbox" id="growtip" ${state.grow?'':'hidden'}>${state.grow?`<b>${CH[state.grow].name}의 힘 키우기</b><br>${CH[state.grow].grow}`:''}</div>
  </div>

  <div class="panel">
    <h2>내 강점으로 습관 키우기</h2>
    <p class="muted small">대표 강점 <b>${CH[main].name}</b>의 방법으로 바꿔서 알려 줄게요.</p>
    <div class="habits">${Object.keys(AREAS).map(a=>{const h=r.habits[a];return `
      <div class="habit">
        <div class="hhead"><h3>${AREAS[a].name} <span class="muted small">${AREAS[a].sub}</span></h3><span class="pill lv${h.level}">${lvTxt[h.level]}</span></div>
        <dl class="kv">
          <dt>잘하는 점</dt><dd>${h.best?esc(h.best.text):'이제 막 시작하는 단계예요. 작은 것부터 하나씩!'}</dd>
          <dt>작은 도전</dt><dd>${h.low?esc(h.low.tip):'지금처럼 꾸준히 이어가요. 친구에게 내 방법을 알려 줘도 좋아요.'}</dd>
        </dl>
        <div class="via" style="--c:${CH[main].c}">${ico(main)}<p><b>${CH[main].name} 방법</b> · ${VIA[main][a]}</p></div>
      </div>`}).join('')}</div>
  </div>

  <div class="panel">
    <div class="hhead"><h2>내 생각</h2><button id="rewrite" class="no-print">고쳐 쓰기</button></div>
    <div class="oans">${OPEN.map((o,j)=>`<div><h3>${j+1}. ${esc(o.q)}</h3>${o.book?bookTitle(j):''}${state.open[j].trim()?`<p>${esc(state.open[j].trim())}</p>`:`<p class="muted no-print">적지 않았어요</p><div class="print-only pline"></div><div class="print-only pline"></div>`}</div>`).join('')}</div>
  </div>

  <div class="panel">
    <h2>나의 다짐</h2>
    <label for="pledge" class="muted small no-print">이번 주에 해 볼 한 가지를 적어 보세요. (저장되지 않아요)</label>
    <p class="print-only" id="pledgeP">${state.pledge.trim()?esc(state.pledge.trim()):'<span class="pline" style="display:block"></span>'}</p>
    <input type="text" class="no-print" id="pledge" maxlength="60" placeholder="예) 매일 잠자기 전 책 10쪽 읽기" value="${esc(state.pledge)}">
    <div class="row no-print">
      <button class="primary" id="print">결과지 인쇄·PDF 저장</button>
      <button id="copy">결과 글로 복사하기</button>
      <button id="again">처음부터 다시 하기</button>
      <span class="toast" id="toast" role="status"></span>
    </div>
    ${INAPP?`<div class="no-print">${inappBox()}</div>`:''}
    <p class="muted small no-print">PDF로 저장하려면 인쇄 창에서 프린터(대상)를 "PDF로 저장"으로 고르세요. 아이폰·아이패드는 인쇄 화면에서 공유 버튼을 눌러 "파일에 저장"을 고르면 PDF로 저장돼요.</p>
    <textarea id="fallback" hidden readonly style="width:100%;min-height:160px;font-family:var(--body);font-size:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px"></textarea>
  </div>

  <details class="no-print">
    <summary>선생님·보호자용 해석 안내</summary>
    <ul>
      <li>이 도구는 자체 제작한 자기성찰 활동지입니다. 신뢰도·타당도를 검증한 표준화 검사가 아니므로 학생을 분류하거나 기록·평가 자료로 쓰지 마세요.</li>
      <li>답 척도는 두 가지입니다. 강점 문항은 "전혀 아니에요·별로 아니에요·조금 그래요·정말 그래요", 습관 문항은 "거의 안 해요·가끔 해요·자주 해요·항상 해요"(빈도)로 묻고, 모두 1~4점으로 계산합니다.</li>
      <li>강점 6개는 각 3문항(4점 척도, 3~12점)의 합입니다. 산은 자기조절(멈추기·할 일 먼저 하기·마음 가라앉히기)만 묻습니다. 동점이면 화면 순서(나무→산)대로 앞의 것을 보여 주고, 같은 점수의 다른 강점을 함께 안내합니다.</li>
      <li>문항마다 "이럴 때를 떠올려 보세요" 상황 예시를 보여 줍니다. 예시는 판단을 돕는 장면일 뿐 정답이 아니며, 아침밥은 무엇이든 조금 먹으면 먹은 것으로, 스마트폰·게임을 거의 하지 않는 학생은 "항상 해요"로 답하도록 안내합니다.</li>
      <li>두 척도 모두 1·2점은 부정 쪽, 3·4점은 긍정 쪽입니다. "잘하는 점"은 3점 이상인 문항에서만 뽑습니다.</li>
      <li>습관 영역은 5문항 평균으로 단계를 정합니다: 3.25 이상 "튼튼해요", 2.5 이상 "자라는 중", 그 아래 "새싹 단계". "작은 도전"은 그 영역에서 가장 낮게 답한 문항(동점이면 앞 문항)에 맞춘 제안이며, "잘하는 점"으로 뽑힌 문항은 제외합니다. 아침밥 문항은 가정 형편과 관계될 수 있어 작은 도전으로 제안하지 않습니다.</li>
      <li>대화 질문 예시: "이 강점이 드러났던 때가 언제였어?", "작은 도전 중에 이번 주에 해 볼 수 있는 건 뭘까?", "어떤 도움이 있으면 더 쉬울까?"</li>
      <li>모든 문항이 긍정 방향이라 무조건 높게 답하는 경향은 걸러지지 않습니다. 점수보다 학생과의 대화 소재로 활용해 주세요.</li>
      <li>잠·아침밥·스마트폰 문항에서 걱정되는 답이 반복되면 결과 화면보다 학생과의 대화, 보호자 상담으로 이어 주세요. 정서·행동 관련 판단은 정서·행동특성검사와 전문기관 절차를 따릅니다.</li>
      <li>마지막 "내 생각 적기" 5문항은 선택 응답입니다. 5번은 가장 재미있게 읽은 책의 제목과 이유를 따로 적게 하며, 결과지에도 제목과 이유가 나뉘어 실립니다. 결과 화면과 인쇄물에 그대로 실리며, 비워 둔 칸은 인쇄물에 손글씨용 빈 줄로 나옵니다.</li>
      <li>시작 화면에서 학년·반·번호·이름을 입력하면 결과 화면과 결과지에 들어가고, 비워 둔 항목은 결과지에 손글씨 칸으로 인쇄됩니다. 입력한 이름도 서버로 보내거나 저장하지 않으며, "처음부터 다시 하기"를 누르면 함께 지워집니다. 인쇄물에는 학생 개인정보가 담기므로 보관과 폐기에 유의해 주세요.</li>
      <li>개인정보: 이름·답변을 서버로 보내거나 브라우저에 저장하지 않습니다. 새로고침하면 결과가 지워집니다.</li>
    </ul>
  </details>
  <p class="note">숲속 나 찾기 · 학생 자기성찰용 자체 제작 도구</p>`;

  app.querySelectorAll('.grow button').forEach(b=>b.onclick=()=>{
    state.grow=b.dataset.k;
    app.querySelectorAll('.grow button').forEach(x=>x.classList.toggle('sel',x===b));
    const tb=document.getElementById('growtip');
    tb.innerHTML=`<b>${CH[state.grow].name}의 힘 키우기</b><br>${CH[state.grow].grow}`;tb.hidden=false;
    document.getElementById('growpanel').classList.remove('no-print');
  });
  const pl=document.getElementById('pledge');pl.oninput=()=>{state.pledge=pl.value;const pp=document.getElementById('pledgeP');if(pl.value.trim())pp.textContent=pl.value.trim();else pp.innerHTML='<span class="pline" style="display:block"></span>';};
  bindInapp();
  document.getElementById('print').onclick=()=>{if(INAPP)document.getElementById('toast').textContent='인쇄 창이 뜨지 않으면 다른 브라우저로 열어 주세요.';try{window.print();}catch(e){document.getElementById('toast').textContent='이 브라우저에서는 인쇄할 수 없어요. 크롬·엣지에서 열어 주세요.';}};
  document.getElementById('rewrite').onclick=()=>{state.step='write';render();window.scrollTo(0,0);};
  document.getElementById('again').onclick=()=>{state.step='intro';state.ans.fill(0);state.grow=null;state.pledge='';state.open=OPEN.map(()=>'');state.title=OPEN.map(()=>'');state.who={g:'',c:'',n:'',name:''};render();window.scrollTo(0,0);};
  document.getElementById('copy').onclick=()=>{
    const txt=summaryText(r,main);
    const toast=document.getElementById('toast');
    const fb=()=>{const ta=document.getElementById('fallback');ta.value=txt;ta.hidden=false;ta.focus();ta.select();toast.textContent='아래 글을 길게 눌러 복사하세요';};
    try{navigator.clipboard.writeText(txt).then(()=>{toast.textContent='복사했어요';},fb);}catch(e){fb();}
  };
}
function nameJosa(w){const c=w.charCodeAt(w.length-1)-0xAC00;return (c>=0&&c<11172&&c%28)?'이는':'는';}
function josa(w){const c=w.charCodeAt(w.length-1)-0xAC00;return (c>=0&&c%28)?'과':'와';}
function summaryText(r,main){
  const t=r.top.map(x=>x.k);
  const lv={3:'튼튼해요',2:'자라는 중',1:'새싹 단계'};
  const wh=state.who;const whoTxt=[wh.g&&wh.g+'학년',wh.c&&wh.c+'반',wh.n&&wh.n+'번',wh.name].filter(Boolean).join(' ');
  let s=`[숲속 나 찾기 결과]${whoTxt?' '+whoTxt:''}\n대표 강점: ${CH[t[0]].name}(${CH[t[0]].trait}), ${CH[t[1]].name}(${CH[t[1]].trait})\n강점 점수: ${ORDER.map(k=>CH[k].name+' '+r.s[k]).join(' / ')}\n`;
  if(state.grow) s+=`키우고 싶은 강점: ${CH[state.grow].name}\n`;
  Object.keys(AREAS).forEach(a=>{const h=r.habits[a];s+=`${AREAS[a].name}: ${lv[h.level]}${h.low?' · 작은 도전 - '+h.low.tip:''}\n`;});
  OPEN.forEach((o,j)=>{const ti=state.title[j].trim(),tx=state.open[j].trim();if(ti||tx)s+=`${j+1}. ${o.q}\n${o.book&&ti?'   책 제목: '+ti+'\n':''}${tx?'   '+tx.replace(/\n/g,'\n   ')+'\n':''}`;});
  if(state.pledge.trim()) s+=`나의 다짐: ${state.pledge.trim()}\n`;
  return s;
}
render();
})();
</script>
</body>
</html>
